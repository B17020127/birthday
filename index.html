<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="x5-page-mode" content="app">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#05070f">
<title>致茜茜 💌</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05070f; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    position: fixed; left: 0; top: 0; display: block;
    touch-action: none; outline: none; -webkit-touch-callout: none;
  }
  #rotate {
    display: none; position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    background: #05070f; color: #ffe9a8; z-index: 9;
    align-items: center; justify-content: center;
    font: 18px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  @media (orientation: landscape) and (max-height: 520px) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate">把手机竖过来看 🙂</div>
<script src="wx-shim.js"></script>
<script src="bundle.js"></script>
</body>
</html>
